<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocoa Bar | ช็อกโกแลตแท่ง</title>
<style>
  :root { --brown:#3b2418; --gold:#c8923a; --cream:#fbf4ea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Sarabun','Segoe UI',sans-serif; background:var(--cream); color:var(--brown); }
  header { background:var(--brown); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header b { font-size:1.3rem; color:var(--gold); }
  header a { color:#fff; text-decoration:none; margin-left:18px; }
  .hero { text-align:center; padding:80px 20px; background:linear-gradient(135deg,#3b2418,#6b3f26); color:#fff; }
  .hero h1 { font-size:2.6rem; margin-bottom:12px; }
  .hero p { opacity:.85; margin-bottom:24px; }
  .btn { display:inline-block; background:var(--gold); color:#fff; border:0; padding:12px 28px; border-radius:30px; font-size:1rem; cursor:pointer; text-decoration:none; }
  .btn:hover { filter:brightness(1.1); }
  section { max-width:1000px; margin:0 auto; padding:50px 20px; }
  h2 { text-align:center; margin-bottom:30px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:24px; }
  .card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .card img { width:100%; height:220px; object-fit:cover; background:#e9dccb; }
  .card .body { padding:16px; }
  .price { color:var(--gold); font-size:1.3rem; font-weight:bold; margin:6px 0; }
  .qty { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .qty button { width:34px; height:34px; border-radius:50%; border:1px solid var(--gold); background:#fff; font-size:1.1rem; cursor:pointer; }
  form { background:#fff; padding:24px; border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); max-width:560px; margin:0 auto; }
  label { display:block; margin:12px 0 4px; font-weight:600; }
  input, textarea { width:100%; padding:10px; border:1px solid #d9c9b3; border-radius:8px; font:inherit; }
  .sum { margin:16px 0; font-size:1.1rem; }
  #msg { text-align:center; margin-top:14px; font-weight:600; }
  footer { text-align:center; padding:24px; background:var(--brown); color:#cdb89f; }
</style>
</head>
<body>

<header>
  <b>🍫 Cocoa Bar</b>
  <nav><a href="#products">สินค้า</a><a href="#order">สั่งซื้อ</a></nav>
</header>

<div class="hero">
  <h1>ช็อกโกแลตแท่ง คุณภาพพรีเมียม</h1>
  <p>เข้มข้น หอมโกโก้แท้ ส่งตรงถึงบ้านคุณ</p>
  <a class="btn" href="#products">เลือกซื้อเลย</a>
</div>

<section id="products">
  <h2>สินค้าของเรา</h2>
  <div class="grid" id="grid">กำลังโหลดสินค้า...</div>
</section>

<section id="order">
  <h2>กรอกข้อมูลสั่งซื้อ</h2>
  <form id="form">
    <label>ชื่อ-นามสกุล</label>
    <input id="name" required>
    <label>เบอร์โทรศัพท์</label>
    <input id="phone" required pattern="[0-9]{9,10}" placeholder="0812345678">
    <label>ที่อยู่จัดส่ง</label>
    <textarea id="address" rows="3" required></textarea>
    <label>จังหวัด</label>
    <input id="province" required>
    <label>รหัสไปรษณีย์</label>
    <input id="zip" required pattern="[0-9]{5}" placeholder="10110">
    <label>หมายเหตุ (ถ้ามี)</label>
    <textarea id="note" rows="2"></textarea>
    <div class="sum">
      ค่าสินค้า: <b id="subtotal">0</b> บาท<br>
      ค่าส่ง: <b id="shipping">0</b> บาท <small>(ซื้อครบ 300 บาท ส่งฟรี)</small><br>
      ยอดรวม: <b id="total">0</b> บาท
    </div>
    <button class="btn" style="width:100%" id="submit">ยืนยันสั่งซื้อ</button>
    <div id="msg"></div>
  </form>
</section>

<footer>© 2026 Cocoa Bar</footer>

<script>
// ===== ใส่ URL ของ Web App ที่ Deploy จาก Apps Script ตรงนี้ =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4A8j4VPaLtU2yNqgiOOfFPuqjM_ITKgvhg3b2ND4vh-Yla6WL_TaVUqxgwE7vY5_Z/exec";

let products = [];
const cart = {};

async function load() {
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    products = data.products;
  } catch (e) {
    // สำรองไว้เผื่อโหลดไม่ได้
    products = [
      { sku:'CHOC-DARK-70', name:'ดาร์กช็อกโกแลต 70%', price:89, image:'images/dark.jpg', stock:50, description:'เข้มข้น หอมโกโก้แท้' },
      { sku:'CHOC-MILK-35', name:'มิลค์ช็อกโกแลต', price:79, image:'images/milk.jpg', stock:80, description:'หวานนุ่ม ละมุนลิ้น' }
    ];
  }
  render();
}

function render() {
  document.getElementById('grid').innerHTML = products.map(p => `
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <div class="body">
        <h3>${p.name}</h3>
        <small>SKU: ${p.sku}</small>
        <p>${p.description || ''}</p>
        <div class="price">${p.price} บาท</div>
        <small>คงเหลือ ${p.stock} ชิ้น</small>
        <div class="qty">
          <button type="button" onclick="chg('${p.sku}',-1)">−</button>
          <span id="q-${p.sku}">0</span>
          <button type="button" onclick="chg('${p.sku}',1)">+</button>
        </div>
      </div>
    </div>`).join('');
}

function chg(sku, d) {
  const p = products.find(x => x.sku === sku);
  const n = Math.max(0, Math.min(p.stock, (cart[sku] || 0) + d));
  cart[sku] = n;
  document.getElementById('q-' + sku).textContent = n;
  const sub = products.reduce((s, x) => s + (cart[x.sku] || 0) * x.price, 0);
  const ship = sub === 0 ? 0 : (sub >= 300 ? 0 : 40);
  document.getElementById('subtotal').textContent = sub.toLocaleString();
  document.getElementById('shipping').textContent = ship;
  document.getElementById('total').textContent = (sub + ship).toLocaleString();
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const items = Object.entries(cart).filter(([, q]) => q > 0).map(([sku, qty]) => ({ sku, qty }));
  const msg = document.getElementById('msg');
  if (!items.length) { msg.textContent = 'กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น'; return; }

  const btn = document.getElementById('submit');
  btn.disabled = true; msg.textContent = 'กำลังส่งออเดอร์...';

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // กัน CORS preflight
      body: JSON.stringify({
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        province: document.getElementById('province').value,
        zip: document.getElementById('zip').value,
        note: document.getElementById('note').value,
        items
      })
    });
    const r = await res.json();
    if (r.ok) {
      msg.style.color = 'green';
      msg.textContent = `สั่งซื้อสำเร็จ! เลขที่ออเดอร์ ${r.orderId} ยอด ${r.total} บาท`;
      e.target.reset();
      Object.keys(cart).forEach(k => cart[k] = 0);
      ['subtotal', 'shipping', 'total'].forEach(id => document.getElementById(id).textContent = '0');
      load();
    } else throw new Error(r.error);
  } catch (err) {
    msg.style.color = 'red';
    msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
  }
  btn.disabled = false;
});

load();
</script>
</body>
</html>
